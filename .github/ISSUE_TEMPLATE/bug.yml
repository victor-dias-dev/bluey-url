name: Bug
description: Something does not work the way the docs describe
title: "bug: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, and what did the app do instead? English or Portuguese is fine.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main @ abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
