name: Feature
description: Propose a change that is not already on the roadmap
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who hits this, and what can they not do today? Check the roadmap first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that would solve it.
    validations:
      required: true
  - type: checkboxes
    id: roadmap
    attributes:
      label: Scope
      options:
        - label: I looked at ROADMAP.md and this is not already listed there.
          required: true
